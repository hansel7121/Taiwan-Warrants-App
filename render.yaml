services:
  - type: web
    name: warrant-scanner
    runtime: python
    # Upgraded from starter (512 MB) after repeated OOM restarts: a forced
    # full warrant re-fetch following a universe change has been observed
    # peaking at 640 MB RSS, over the starter cap (issue #57). `standard`
    # gives 1 vCPU / 2 GB. Keep this in sync with the dashboard's actual
    # tier -- a stale `starter` here would silently downgrade the service
    # on the next blueprint sync.
    plan: standard
    buildCommand: pip install -r requirements.txt
    # Exactly 1 worker: market-data caches live in process memory + APScheduler.
    # timeout 240 (was 180): heavy sync work (universe scrape, arb match) can
    # peg the CPU cap long enough that gunicorn's arbiter can't service its
    # heartbeat and kills the worker mid-request (502s + worker restarts
    # observed in production on the starter plan). More headroom, paired with
    # services/scheduler.py's sync lock and fewer arb_logic threads, which cut
    # the actual CPU contention causing the stalls.
    #
    # threads 24 (was 8, issue #57): /live_prices/stream holds a gthread for
    # its entire connection lifetime (one per open Live Warrant tab, capped by
    # _SSE_MAX_STREAMS=4), not just per-request. At 8 threads, a couple of
    # open tabs plus a page load's burst of @require_auth calls could pin
    # enough of the pool to starve /healthz past Render's 5s check, killing
    # the instance -- observed only after the live-warrant SSE route shipped.
    # Threads are cheap and this workload is I/O-bound, so headroom here comes
    # free with the standard-plan CPU/RAM upgrade above.
    startCommand: gunicorn -w 1 --threads 24 --timeout 240 -b 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # Cap glibc per-thread malloc arenas: under gunicorn threads they
      # balloon RSS. Harmless on non-glibc platforms.
      - key: MALLOC_ARENA_MAX
        value: "2"
      # ENABLE_SCHEDULER turns on the in-process background jobs that refresh
      # Supabase market snapshots AND run the Direct-Arb suggestions scan, on a
      # wall-clock 15-min cron grid gated to each market's trading hours. ON:
      # the server fetches and populates the Suggestions tab on its own, without
      # depending on a local run. Single-worker executor keeps peak memory
      # bounded regardless of instance size.
      - key: ENABLE_SCHEDULER
        value: "1"
      # Step 5b: readers now serve the Supabase snapshots (falling back to a
      # live fetch on empty/error/unconfigured). With ENABLE_SCHEDULER above,
      # the scheduler keeps those snapshots fresh during market hours; off-hours
      # the readers serve the last pre-close snapshot (timestamped in the UI).
      - key: MARKET_SOURCE
        value: "supabase"
      # Paste these in the Render dashboard — never commit real values.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Where the browser's live-price EventSource connects (issue #58 item
      # 1) -- the warrant-live-sse service below. Assumes Render's default
      # <name>.onrender.com hostname; update if a custom domain is added to
      # that service.
      - key: SSE_STREAM_BASE_URL
        value: https://warrant-live-sse.onrender.com

  # Live-price SSE service (issue #58 item 1), split out of the web service
  # above so an open Live Warrant tab no longer pins a gunicorn thread on the
  # same pool that serves every other (CPU-bound) route for the connection's
  # whole life. Runs sse_wsgi.py alone, on gunicorn's gevent worker class --
  # safe here specifically because this service does no CPU-bound work, only
  # I/O (Supabase reads, holding idle SSE connections). The main web service
  # stays on gthread deliberately: its other routes (IV solves, IV surface
  # interpolation, arb matching) are synchronous and CPU-bound, and gevent's
  # single-threaded event loop would let one slow request there stall every
  # other greenlet in the process, including every open SSE stream.
  #
  # No shared memory with the web service (same pattern as broker-worker
  # below): this process runs its own live_price/live_depth pollers against
  # the same Supabase project.
  - type: web
    name: warrant-live-sse
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Exactly 1 worker, same reason as the main service: live_price/live_depth
    # caches live in process memory. No --threads flag -- gevent concurrency
    # comes from greenlets, not OS threads.
    startCommand: gunicorn -w 1 --worker-class gevent --timeout 30 -b 0.0.0.0:$PORT sse_wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # The main web service's own origin, so its cross-origin EventSource
      # request is allowed (sse.py's CORS header). Assumes Render's default
      # <name>.onrender.com hostname; update alongside SSE_STREAM_BASE_URL
      # above if either service gets a custom domain.
      - key: SSE_CORS_ORIGIN
        value: https://warrant-scanner.onrender.com
      # Paste these in the Render dashboard — never commit real values.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # Broker worker (issue #43, part of the Live warrant epic #39).
  #
  # ADDITIVE ONLY: the web service above and the Supabase project are untouched
  # — no migration, no cutover. This is a separate service that reads/writes the
  # SAME Supabase project from a different region.
  #
  # WHY SINGAPORE: the live broker feed is the only latency-sensitive hop in the
  # system. Everything else (page loads, the 15-min refresh grid) is not, so only
  # the worker moves closer to the Taiwan brokers. It stays in Singapore from the
  # start rather than being moved later, because relocating a service that holds
  # live broker sessions means dropping them.
  # NOTE: verify `singapore` is still Render's current region slug when the
  # service is first created — slugs occasionally change and this file cannot
  # be validated against Render's API offline.
  #
  # WHY DOCKER (the web service stays on the native Python runtime): KGI's
  # SuperPy SDK needs libCGCrypt.so installed at the system level (chmod 755 +
  # copy into /lib/x86_64-linux-gnu/) plus KGI's cert-generation program run
  # against it. That needs explicit Dockerfile RUN steps, which a buildpack
  # runtime's build/run split can't do reliably. See Dockerfile.worker.
  #
  # WHY autoDeploy: false: a worker restart drops EVERY live broker connection
  # and forces a full relogin across every Broker Account. Deploys are triggered
  # by hand from the Render dashboard, timed for a window when no session is
  # live.
  #
  # WHY standard, not starter: sized up front rather than discovered
  # empirically the way the web service's starter tightness was. Holding several
  # live broker sessions has a far worse failure mode under memory pressure — a
  # crashed session drops real trading coverage, not just one slow page.
  # Right-size later against measured usage.
  - type: worker
    name: broker-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    region: singapore
    plan: standard
    autoDeploy: false
    envVars:
      # Market hours and days-to-expiry are computed against local "today".
      - key: TZ
        value: Asia/Taipei
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Same Supabase project as the web service, read from a new region.
      # Paste these in the Render dashboard — never commit real values.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
