# Render Blueprint for the warrant-scanner web service. Create a Blueprint from
# this repo to provision it; the Supabase secrets below are pasted in the
# dashboard, never committed.
services:
  - type: web
    name: warrant-scanner
    runtime: python
    # 512 MB free tier is too tight for the pandas/numpy/scipy working set.
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Exactly 1 worker: in-process market caches and APScheduler would diverge.
    # timeout 240: universe scrape / arb match can outlast gunicorn's heartbeat.
    startCommand: gunicorn -w 1 --threads 8 --timeout 240 -b 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # glibc per-thread malloc arenas balloon RSS under gunicorn threads.
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Background refresh of Supabase market snapshots + the Direct-Arb
      # suggestions scan, on a 15-min grid gated to each market's hours.
      - key: ENABLE_SCHEDULER
        value: "1"
      # Readers serve Supabase snapshots, falling back to a live fetch.
      - key: MARKET_SOURCE
        value: "supabase"
      # Paste real values in the Render dashboard — never commit them.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
