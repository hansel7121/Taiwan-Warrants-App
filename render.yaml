services:
  - type: web
    name: warrant-scanner
    runtime: python
    # The free tier's 512 MB is tight for the pandas/numpy/scipy working set.
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Exactly 1 worker: market-data caches live in process memory + APScheduler.
    # timeout 240 (was 180): heavy sync work (universe scrape, arb match) can
    # peg the starter plan's 0.5 vCPU cap long enough that gunicorn's arbiter
    # can't service its heartbeat and kills the worker mid-request (502s +
    # worker restarts observed in production). More headroom, paired with
    # services/scheduler.py's sync lock and fewer arb_logic threads, which cut
    # the actual CPU contention causing the stalls.
    startCommand: gunicorn -w 1 --threads 8 --timeout 240 -b 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # Cap glibc per-thread malloc arenas: under gunicorn threads they
      # balloon RSS. Harmless on non-glibc platforms.
      - key: MALLOC_ARENA_MAX
        value: "2"
      # ENABLE_SCHEDULER turns on the in-process background jobs that refresh
      # Supabase market snapshots AND run the Direct-Arb suggestions scan, on a
      # wall-clock 15-min cron grid gated to each market's trading hours. ON:
      # the server fetches and populates the Suggestions tab on its own, without
      # depending on a local run. Single-worker executor keeps it under the
      # starter instance's 512 MB.
      - key: ENABLE_SCHEDULER
        value: "1"
      # Step 5b: readers now serve the Supabase snapshots (falling back to a
      # live fetch on empty/error/unconfigured). With ENABLE_SCHEDULER above,
      # the scheduler keeps those snapshots fresh during market hours; off-hours
      # the readers serve the last pre-close snapshot (timestamped in the UI).
      - key: MARKET_SOURCE
        value: "supabase"
      # Paste these in the Render dashboard — never commit real values.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # Broker worker (issue #20, Phase 0 of the live-broker epic #19).
  #
  # ADDITIVE ONLY: the web service above and the Supabase project are untouched
  # — no migration, no cutover. This is a new service that reads/writes the SAME
  # Supabase project from a different region.
  #
  # WHY SINGAPORE: the live broker-tick arb loop is the only latency-sensitive
  # hop in the system. Everything else (page loads, the 15-min refresh grid) is
  # not, so only the worker moves closer to the Taiwan brokers.
  # See docs/adr/0001-broker-worker-separate-region.md.
  # NOTE: verify `singapore` is still Render's current region slug when the
  # service is first created — slugs occasionally change and this file cannot
  # be validated against Render's API offline.
  #
  # WHY DOCKER (the web service stays on the native Python runtime): KGI's
  # SuperPy SDK needs libCGCrypt.so installed at the system level (chmod 755 +
  # copy into /lib/x86_64-linux-gnu/) plus KGI's cert-generation program run
  # against it. That needs explicit Dockerfile RUN steps, which a buildpack
  # runtime's build/run split can't do reliably. See Dockerfile.worker and
  # docs/adr/0010-worker-hosting-and-command-channel.md.
  #
  # WHY autoDeploy: false: a worker restart drops EVERY live broker connection
  # and forces a full relogin/resubscribe across the shared watchlist — and
  # would fire a false-alarm disconnect alert if it happened mid-session.
  # Deploys are triggered by hand from the Render dashboard, timed for the
  # worker's own `stopped` window (docs/adr/0009).
  #
  # WHY standard, not starter: sized up front rather than discovered
  # empirically the way the web service's starter tightness was. Holding
  # several live broker sessions plus mirrored option data has a far worse
  # failure mode under memory pressure — a crashed live session drops real
  # trading coverage, not just one slow page. Right-size later against measured
  # usage.
  - type: worker
    name: broker-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    region: singapore
    plan: standard
    autoDeploy: false
    envVars:
      # Market hours and days-to-expiry are computed against local "today".
      - key: TZ
        value: Asia/Taipei
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Same Supabase project as the web service, read from a new region.
      # Paste these in the Render dashboard — never commit real values.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
