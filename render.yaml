services:
  - type: web
    name: warrant-scanner
    runtime: python
    # Keep in sync with the Render dashboard plan (1 vCPU / 2 GB min — see issue #57).
    plan: standard
    # build_rust.sh compiles rust/warrants_core (the IV engine) and installs a
    # rustup toolchain if the build image has none. It is best-effort: without
    # it logic/iv_engine.py falls back to the pure-Python solver.
    buildCommand: pip install -r requirements.txt && ./scripts/build_rust.sh
    # Exactly 1 worker: market-data caches live in process memory + APScheduler.
    startCommand: gunicorn -w 1 --threads 8 --timeout 240 -b 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MALLOC_ARENA_MAX
        value: "2"
      # rustup/cargo need a writable home during the build step.
      - key: CARGO_HOME
        value: "/opt/render/project/.cargo"
      - key: RUSTUP_HOME
        value: "/opt/render/project/.rustup"
      # Enables scheduler.py: Supabase market snapshot refresh + Direct-Arb suggestions scan.
      - key: ENABLE_SCHEDULER
        value: "1"
      # Serve market data from Supabase snapshots, falling back to live fetch when empty/unconfigured.
      - key: MARKET_SOURCE
        value: "supabase"
      # Positive env check for local_mode()/store.py mirroring (services/auth.py) —
      # must be "production" here so this deploy stays a no-op.
      - key: APP_ENV
        value: "production"
      # Paste these in the Render dashboard — never commit real values.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
