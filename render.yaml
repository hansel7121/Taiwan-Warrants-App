services:
  - type: web
    name: warrant-scanner
    runtime: python
    # The free tier's 512 MB is tight for the pandas/numpy/scipy working set.
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Exactly 1 worker: market-data caches live in process memory + APScheduler.
    startCommand: gunicorn -w 1 --threads 8 --timeout 180 -b 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # Cap glibc per-thread malloc arenas: under gunicorn threads they
      # balloon RSS. Harmless on non-glibc platforms.
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Phase 2 cutover (staged). ENABLE_SCHEDULER turns on the background
      # refresh jobs that WRITE Supabase market snapshots (gated to each
      # market's trading hours, on a wall-clock 15-min cron grid). Readers
      # still serve live data until MARKET_SOURCE=supabase is added (step 5b),
      # so this alone is behavior-preserving.
      - key: ENABLE_SCHEDULER
        value: "1"
      # Step 5b: readers now serve the Supabase snapshots (falling back to a
      # live fetch on empty/error/unconfigured). With ENABLE_SCHEDULER above,
      # the scheduler keeps those snapshots fresh during market hours; off-hours
      # the readers serve the last pre-close snapshot (timestamped in the UI).
      - key: MARKET_SOURCE
        value: "supabase"
      # Paste these in the Render dashboard — never commit real values.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
