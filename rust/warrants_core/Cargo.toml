[package]
name = "warrants_core"
version = "0.1.0"
edition = "2021"
description = "Black-Scholes IV/delta kernels for the Taiwan warrants scanner"
license = "MIT"

[lib]
name = "warrants_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py311"] }
numpy = "0.22"
rayon = "1.10"
libm = "0.2"
microlp = "0.6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
